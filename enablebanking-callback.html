<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoveApp – Callback Enable Banking</title>
  <style>
    body { font-family: -apple-system, Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #0f0f12; color: #eee; }
    .card { max-width: 420px; margin: 0 auto; background: #1c1c22; border-radius: 16px; padding: 32px 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #aaa; font-size: 14px; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #ff6b00; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Autorizzazione completata</h1>
    <p>Stai tornando a <strong>MoveApp</strong>…</p>
    <p id="status">Apertura dell'app in corso. Se non succede nulla, premi il pulsante.</p>
    <a class="btn" id="open" href="#">Apri MoveApp</a>
  </div>
  <script>
    (function () {
      var qs = window.location.search || "";
      var target = "moveapp://enablebanking-callback" + qs;
      document.getElementById("open").setAttribute("href", target);
      // Try to hand off to the app immediately; the OS App Link for
      // https://sephirich.github.io/enablebanking-callback normally
      // intercepts before this page is even shown.
      setTimeout(function () { window.location.href = target; }, 300);
    })();
  </script>
</body>
</html>
